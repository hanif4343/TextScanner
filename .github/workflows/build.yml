name: Build & Release TextScanner APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle Wrapper
        run: |
          # Install gradle to generate wrapper
          wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip -O gradle.zip
          unzip -q gradle.zip
          export PATH=$PATH:$(pwd)/gradle-8.0/bin
          
          # Generate gradlew in project root
          gradle wrapper --gradle-version 8.0
          chmod +x gradlew

      - name: Set version info
        run: |
          VERSION_CODE=${{ github.run_number }}
          DATE=$(date +'%Y%m%d')
          VERSION_NAME="1.0.${DATE}"
          sed -i "s/versionCode [0-9]*/versionCode $VERSION_CODE/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_NAME\"/" app/build.gradle
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$KEYSTORE_PATH \
            -Pandroid.injected.signing.store.password=$STORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Rename APK
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk \
             release-output/TextScanner-v${{ env.VERSION_NAME }}-code${{ env.VERSION_CODE }}.apk
          echo "APK_PATH=release-output/TextScanner-v${{ env.VERSION_NAME }}-code${{ env.VERSION_CODE }}.apk" >> $GITHUB_ENV

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TextScanner-APK-v${{ env.VERSION_NAME }}
          path: ${{ env.APK_PATH }}
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          name: "TextScanner v${{ env.VERSION_NAME }} (build ${{ env.VERSION_CODE }})"
          body: |
            ## TextScanner Update
            **Version:** ${{ env.VERSION_NAME }}
            **Build:** ${{ env.VERSION_CODE }}
            ### Changes
            ${{ github.event.head_commit.message }}
            ---
            APK ডাউনলোড করে ইনস্টল করুন ✅
          files: ${{ env.APK_PATH }}
          token: ${{ secrets.GITHUB_TOKEN }}
          make_latest: true
